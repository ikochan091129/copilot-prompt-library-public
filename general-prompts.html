ilters input{grid-column:auto}}</style></head><body><header><a href="./index.html">← エージェント集へ</a><h1>汎用プロンプト集</h1><p>9カテゴリ・40件。テーマで絞り込み、穴埋め入力から完成文をコピーできます。</p></header><main><div class="filters"><input id="search" placeholder="キーワードで検索" aria-label="検索"><select id="category" aria-label="カテゴリ"></select><select id="theme" aria-label="テーマ"></select><select id="sort" aria-label="並び順"><option value="original">元の順番</option><option value="popular">よく使う順</option><option value="favorite">お気に入り優先</option></select></div><div class="minor"><label><input type="checkbox" id="onlyFav"> お気に入りだけ</label><label><input type="checkbox" id="recommended"> 新規追加だけ</label><span class="hint">★・コピー回数はこのブラウザ内に保存。端末間では同期しません。</span></div><p id="count"></p><div id="list"></div></main><script>const catalog=[{"category":"調査・情報収集","title":"一次情報で調査","prompt":"［テーマ］を対象期間［対象期間］・地域［対象地域］で調査してください。公式資料・原著などの一次情報を優先し、出典URL・発行日・確認日・未確認点を示してください。本文を読めない資料を確認済みとしないでください。","theme":"調査","tag":"調査","priority":"既存","legacy":"調査・情報収集::一次情報で調査"},{"category":"調査・情報収集","title":"複数候補を比較","prompt":"候補［比較対象（2件以上）］を、目的［目的］・評価軸［評価軸］に沿って比較してください。条件差、根拠、長所・短所、未確認点を整理し、推奨案と判断が変わる条件を示してください。","theme":"調査","tag":"調査","priority":"既存","legacy":"調査・情報収集::複数候補を比較"},{"category":"調査・情報収集","title":"情報の真偽確認","prompt":"次の主張の真偽を検証してください：［主張］。確認済み事実、反証、出典の信頼性、現時点で断定できない点を区別してください。","theme":"調査","tag":"調査","priority":"既存","legacy":"調査・情報収集::情報の真偽確認"},{"category":"調査・情報収集","title":"最新変更点の抽出","prompt":"［製品・制度］の前回確認時点［日付］からの変更点を調べ、変更前後、利用者への影響、試す価値、公式出典を簡潔に示してください。","theme":"調査","tag":"調査","priority":"既存","legacy":"調査・情報収集::最新変更点の抽出"},{"category":"文章・コミュニケーション","title":"丁寧なメール作成","prompt":"以下の要件から、件名と送信可能なメール本文を作成してください。相手：［相手］、目的：［目的］、伝えたい内容：［内容］、希望する丁寧さ：［トーン］。未提供の事実を補わないでください。","theme":"文章","tag":"文章","priority":"既存","legacy":"文章・メール::丁寧なメール作成"},{"category":"文章・コミュニケーション","title":"返信文の作成","prompt":"次のメールへの返信を作成してください。［受信文］。返信方針：［要点］。相手の質問に漏れなく答え、簡潔で自然なビジネス日本語にしてください。","theme":"文章","tag":"文章","priority":"既存","legacy":"文章・メール::返信文の作成"},{"category":"文章・コミュニケーション","title":"文章を短く整理","prompt":"次の文章の意味を変えずに、読みやすく簡潔に直してください：［文章］。修正後の全文と、主な変更点を提示してください。","theme":"文章","tag":"文章","priority":"既存","legacy":"文章・メール::文章を短く整理"},{"category":"文章・コミュニケーション","title":"箇条書きを文章化","prompt":"次の箇条書きを、読み手［対象読者］向けの自然な文章にしてください：［メモ］。事実・数値は元の内容を維持してください。","theme":"文章","tag":"文章","priority":"既存","legacy":"文章・メール::箇条書きを文章化"},{"category":"資料・ドキュメント","title":"5枚のスライド構成","prompt":"テーマ［テーマ］、読者［読者］、目的［目的］、枚数［枚数］、説明時間［説明時間］に適したスライド構成を提案してください。各ページに結論型タイトル、根拠、図表案、話す内容を付けてください。","theme":"資料","tag":"資料","priority":"既存","legacy":"資料作成::5枚のスライド構成"},{"category":"資料・ドキュメント","title":"1ページ要約","prompt":"内容［内容］を、用途［用途］・長さ［長さ］に合わせて要約してください。結論、重要な根拠、リスク、次のアクションを必要に応じて含め、未確認情報を隠さないでください。","theme":"資料","tag":"資料","priority":"既存","legacy":"資料作成::1ページ要約"},{"category":"資料・ドキュメント","title":"伝わる図表を選ぶ","prompt":"［データの概要］について、目的［伝えたい結論］に合うグラフや表の種類、軸・単位・凡例・注記の設計案を示してください。実データがなければ架空の数値を描かないでください。","theme":"資料","tag":"資料","priority":"既存","legacy":"資料作成::伝わる図表を選ぶ"},{"category":"分析・意思決定","title":"原因仮説の整理","prompt":"課題［現象］について、事実・仮説・未確認情報を区別し、原因候補、根拠、反証条件、優先して確認する3項目を整理してください。","theme":"分析","tag":"分析","priority":"既存","legacy":"分析・問題解決::原因仮説の整理"},{"category":"分析・意思決定","title":"意思決定の比較","prompt":"選択肢［候補］を、目的［目的］、制約［制約］に基づいて比較してください。判断基準、トレードオフ、重大な不明点、推奨案とその条件を示してください。","theme":"分析","tag":"分析","priority":"既存","legacy":"分析・問題解決::意思決定の比較"},{"category":"分析・意思決定","title":"反論と弱点の点検","prompt":"次の提案を批判的にレビューしてください：［提案］。成立条件、見落とし、反対意見、追加で確認すべき根拠、改善策を整理してください。","theme":"分析","tag":"分析","priority":"既存","legacy":"分析・問題解決::反論と弱点の点検"},{"category":"学習・理解","title":"ゼロから解説","prompt":"［学びたいテーマ］を、前提知識が少ない人にも分かるように、全体像→基本原理→具体例→よくある誤解の順に説明してください。","theme":"学習","tag":"学習","priority":"既存","legacy":"学習・理解::ゼロから解説"},{"category":"学習・理解","title":"数式の意味を説明","prompt":"式［数式］について、変数・単位・前提条件・各項の物理的意味・使えない条件を段階的に説明してください。","theme":"学習","tag":"学習","priority":"既存","legacy":"学習・理解::数式の意味を説明"},{"category":"学習・理解","title":"理解度テスト","prompt":"テーマ［テーマ］について、難度［難度］、問題数［問題数］、形式［形式］の理解度テストをしてください。1問ずつ出題し、回答後に解説してください。","theme":"学習","tag":"学習","priority":"既存","legacy":"学習・理解::理解度テスト"},{"category":"Excel・データ・コード","title":"Excel関数の提案","prompt":"Excelで［やりたい処理］を実現する式を作ってください。列構成：［列名・セル例］。完成式、使い方、エラー処理を示してください。","theme":"データ","tag":"データ","priority":"既存","legacy":"Excel・プログラミング::Excel関数の提案"},{"category":"Excel・データ・コード","title":"Pythonコード作成","prompt":"Pythonで［処理内容］を実現してください。入力［入力形式］、出力［出力形式］、実行環境［OS・Python版］、利用可能なライブラリ［ライブラリ］を考慮し、コード・実行手順・テスト・元データ保護を示してください。未実行なら明記してください。","theme":"データ","tag":"データ","priority":"既存","legacy":"Excel・プログラミング::Pythonコード作成"},{"category":"Excel・データ・コード","title":"エラーの原因を切り分け","prompt":"以下のエラーを調査してください。環境：［環境］、操作：［操作］、エラー全文：［エラー］、期待結果：［期待］。原因仮説、確認順、最小修正案を提示してください。","theme":"データ","tag":"データ","priority":"既存","legacy":"Excel・プログラミング::エラーの原因を切り分け"},{"category":"AI活用・効率化","title":"プロンプト改善","prompt":"元のプロンプト［元プロンプト］を目的［目的］に合わせて改善してください。入力条件、回答形式、誤認防止と簡潔さを考慮し、改善後の全文・変更理由・変更前後の検証例と合格基準を示してください。","theme":"AI","tag":"AI","priority":"既存","legacy":"AI活用・業務効率化::プロンプト改善"},{"category":"AI活用・効率化","title":"定型作業の効率化","prompt":"作業［手順］を効率化したいです。現状の手作業、必要ツール、実行権限、安全上の注意、改善案を整理し、最も負担が小さい方法を提案してください。","theme":"AI","tag":"AI","priority":"既存","legacy":"AI活用・業務効率化::定型作業の効率化"},{"category":"計画・タスク管理","title":"タスクの優先順位","prompt":"次のタスク一覧を、期限、重要度、所要時間、依存関係で整理し、今日実施する順番と理由を示してください：［タスク一覧］。","theme":"計画","tag":"計画","priority":"既存","legacy":"AI活用・業務効率化::タスクの優先順位"},{"category":"調査・情報収集","title":"情報源の矛盾を整理","prompt":"資料［資料A・資料B］の主張の相違を、版数・公開時期・前提条件・定義の違いから確認し、一致点・相違点・未解決点を整理してください。","theme":"資料比較","tag":"資料比較","priority":"B"},{"category":"調査・情報収集","title":"調査計画を設計","prompt":"テーマ［テーマ］について目的［目的］と期限［期限］を踏まえ、調査順序、一次資料、検証方法、終了条件を提案してください。","theme":"調査計画","tag":"調査計画","priority":"B"},{"category":"文章・コミュニケーション","title":"文章を読者向けに書き換え","prompt":"文章［元の文章］を対象読者［読者］・目的［目的］に合わせて書き換えてください。数値・事実は変えず、修正点を簡潔に示してください。","theme":"文章改善","tag":"文章改善","priority":"A"},{"category":"文章・コミュニケーション","title":"文章・メールのトーン調整","prompt":"文章［元の文章］を希望トーン［トーン］に整えてください。意味や依頼事項を変えず、完成版を先に示してください。","theme":"文章改善","tag":"文章改善","priority":"C"},{"category":"資料・ドキュメント","title":"PDF・添付資料を読解","prompt":"添付資料［資料名］について確認したい内容［内容］を要約してください。実際に読めた文書名・版数・ページ・節・図表を示し、未取得部分は推測しないでください。","theme":"PDF読解","tag":"PDF読解","priority":"A"},{"category":"資料・ドキュメント","title":"議事録を作成","prompt":"会議メモ［議事メモ］から目的［目的］に沿って議事録を作成し、決定事項・保留事項・担当者・期限を整理してください。未記載事項は補わないでください。","theme":"議事録","tag":"議事録","priority":"A"},{"category":"資料・ドキュメント","title":"図表の説明文を作成","prompt":"図表［図表の内容］を読者［読者］向けに説明してください。事実として読み取れる傾向、仮説、注意すべき条件を分け、数値を創作しないでください。","theme":"図表説明","tag":"図表説明","priority":"B"},{"category":"資料・ドキュメント","title":"会議・相談を事前準備","prompt":"会議テーマ［テーマ］、目的［目的］、参加者［参加者］に合わせて議題、論点、確認質問、必要資料、決定事項の記録方法を提案してください。","theme":"会議準備","tag":"会議準備","priority":"C"},{"category":"分析・意思決定","title":"リスクと対策を整理","prompt":"計画［計画］についてリスク、発生条件、影響、予防策、検知方法、発生時対応を整理してください。根拠のない発生確率は設定しないでください。","theme":"リスク分析","tag":"リスク分析","priority":"A"},{"category":"学習・理解","title":"学習計画を作成","prompt":"テーマ［テーマ］を現状レベル［理解度］、目標［目標］、学習時間［時間］に合わせて段階的な学習計画にしてください。到達基準と復習方法も示してください。","theme":"学習計画","tag":"学習計画","priority":"B"},{"category":"Excel・データ・コード","title":"CSV・Excelデータを分析","prompt":"データ［ファイルまたは列構成］を目的［分析目的］に沿って分析してください。件数・欠損・重複・単位・時間軸・外れ値・集計条件を点検し、未閲覧ならその旨を示してください。","theme":"データ分析","tag":"データ分析","priority":"A"},{"category":"Excel・データ・コード","title":"データ可視化を設計","prompt":"データ［データ構成］で伝えたい結論［結論］に合うグラフ、軸、単位、凡例、注記を設計してください。実データがなければ仕様案として提示してください。","theme":"可視化","tag":"可視化","priority":"C"},{"category":"AI活用・効率化","title":"AIへの作業依頼を設計","prompt":"作業［作業］、成果物［成果物］、利用ツール［ツール］、制約［制約］をもとに、必要情報、段階的な手順、検証、完了条件を備えたAIへの依頼文を作成してください。権限外の操作は提案だけに留めてください。","theme":"AI委任","tag":"AI委任","priority":"A"},{"category":"計画・タスク管理","title":"作業計画を作成","prompt":"目標［目標］、期限［期限］、作業一覧［作業］、使える時間［時間］から優先順位、マイルストーン、依存関係、余裕を考えた計画を作成してください。","theme":"計画作成","tag":"計画作成","priority":"A"},{"category":"計画・タスク管理","title":"進捗をレビュー","prompt":"計画［計画］と実績［進捗］を比較し、完了、遅延、課題、見込み、次の3つのアクションを示してください。未報告の作業は完了扱いしないでください。","theme":"進捗管理","tag":"進捗管理","priority":"A"},{"category":"アイデア・企画","title":"アイデアを発想","prompt":"テーマ［テーマ］、目標［目標］、制約［制約］に合う案を複数提案し、独自性と最初の実施手順を整理してください。","theme":"アイデア発想","tag":"アイデア発想","priority":"B"},{"category":"アイデア・企画","title":"企画案を評価","prompt":"候補［候補一覧］を目的［目的］・制約［制約］に照らして比較し、実現性、期待効果、リスク、検証方法、最初に試す案を示してください。","theme":"企画評価","tag":"企画評価","priority":"B"}];
const $=id=>document.getElementById(id);const storageKey='prompt-library-general-v1';let state={};try{state=JSON.parse(localStorage.getItem(storageKey)||'{}')||{}}catch(e){}const favorites=state.favorites||{},uses=state.uses||{};
function idOf(item){return item.legacy||item.category+'::'+item.title}function persist(){try{localStorage.setItem(storageKey,JSON.stringify({favorites,uses}))}catch(e){}}
function options(el,labels){el.replaceChildren();for(const v of labels){const o=document.createElement('option');o.value=v;o.textContent=v;el.append(o)}}
options($('category'),['すべて',...new Set(catalog.map(x=>x.category))]);
function themes(){const c=$('category').value;const list=catalog.filter(x=>c==='すべて'||x.category===c);const old=$('theme').value;options($('theme'),['すべて',...new Set(list.map(x=>x.theme))]);if([...$('theme').options].some(o=>o.value===old))$('theme').value=old}
themes();
function show(){const q=$('search').value.toLowerCase(),c=$('category').value,t=$('theme').value,sort=$('sort').value;let found=catalog.map((item,i)=>({item,i})).filter(({item})=>(c==='すべて'||item.category===c)&&(t==='すべて'||item.theme===t)&&(!$('onlyFav').checked||favorites[idOf(item)])&&(!$('recommended').checked||item.priority!=='既存')&&[item.category,item.title,item.prompt,item.theme,item.tag].join(' ').toLowerCase().includes(q));if(sort==='popular')found.sort((a,b)=>(uses[idOf(b.item)]||0)-(uses[idOf(a.item)]||0)||a.i-b.i);if(sort==='favorite')found.sort((a,b)=>Number(!!favorites[idOf(b.item)])-Number(!!favorites[idOf(a.item)])||a.i-b.i);
$('count').textContent=found.length+' / '+catalog.length+'件';$('list').replaceChildren();for(const {item} of found){const key=idOf(item);const card=document.createElement('article');card.className='item';const top=document.createElement('div');top.className='top';const left=document.createElement('div');const meta=document.createElement('div');meta.className='meta';meta.textContent=item.category+' / '+item.theme+(item.priority==='既存'?'':' / 新規'+item.priority);const title=document.createElement('h2');title.textContent=item.title;const times=document.createElement('div');times.className='hint';times.textContent='コピー '+(uses[key]||0)+'回';left.append(meta,title,times);const actions=document.createElement('div');actions.className='actions';const star=document.createElement('button');star.className='star';star.textContent=favorites[key]?'★':'☆';star.setAttribute('aria-label',favorites[key]?'お気に入り解除':'お気に入り登録');star.onclick=()=>{favorites[key]=!favorites[key];persist();show()};const copy=document.createElement('button');copy.className='outline';copy.textContent='原文コピー';const body=document.createElement('div');body.className='body';body.textContent=item.prompt;
async function copyText(text,button){try{await navigator.clipboard.writeText(text);uses[key]=(uses[key]||0)+1;persist();times.textContent='コピー '+uses[key]+'回';button.textContent='コピー完了';setTimeout(()=>{if(sort==='popular')show();else button.textContent=button===copy?'原文コピー':'完成版コピー'},900)}catch(e){const r=document.createRange();r.selectNodeContents(body);getSelection().removeAllRanges();getSelection().addRange(r);alert('自動コピーに失敗しました。文章を選択してコピーしてください。')}}
copy.onclick=()=>copyText(item.prompt,copy);actions.append(star,copy);const fields=[...new Set([...item.prompt.matchAll(/［([^］]+)］/g)].map(m=>m[1]))];const editor=document.createElement('section');editor.className='editor hidden';const values={};const preview=document.createElement('div');preview.className='preview';const message=document.createElement('p');message.className='warn';function makeText(){return item.prompt.replace(/［([^］]+)］/g,(raw,k)=>values[k]?.trim()||raw)}function update(){preview.textContent=makeText();message.textContent=fields.filter(k=>!values[k]?.trim()).length+'項目が未入力です。必要な項目を埋めてください。'}for(const field of fields){const wrap=document.createElement('div');wrap.className='field';const label=document.createElement('label');label.textContent=field;const input=document.createElement('input');input.placeholder=field;input.setAttribute('aria-label',field);input.oninput=()=>{values[field]=input.value;update()};wrap.append(label,input);editor.append(wrap)}update();const complete=document.createElement('button');complete.textContent='完成版コピー';complete.onclick=()=>{if(fields.some(k=>!values[k]?.trim())){message.textContent='未入力項目があります。入力するとコピーできます。';return}copyText(makeText(),complete)};editor.append(message,preview,complete);if(fields.length){const toggle=document.createElement('button');toggle.textContent='穴埋め入力';toggle.onclick=()=>editor.classList.toggle('hidden');actions.append(toggle)}top.append(left,actions);card.append(top,body,editor);$('list').append(card)}}$('search').oninput=show;$('category').onchange=()=>{themes();show()};$('theme').onchange=show;$('sort').onchange=show;$('onlyFav').onchange=show;$('recommended').onchange=show;show();</script></body></html>
