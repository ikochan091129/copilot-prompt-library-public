<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汎用プロンプト集 | Prompt Library</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;background:#0d1320;color:#e9edf7}*{box-sizing:border-box}body{margin:0}header{background:#111a2c;padding:24px clamp(16px,5vw,64px);border-bottom:1px solid #2b3446}a{color:#8fe0bd}h1{font-size:25px;margin:10px 0 7px}p{line-height:1.6;color:#b6c3d4}main{max-width:1050px;margin:auto;padding:20px}input,select{background:#172237;border:1px solid #42546c;border-radius:9px;color:white;padding:12px;width:100%;font-size:15px}.filters{display:grid;grid-template-columns:1fr 220px 190px;gap:12px;margin:20px 0}.favfilter{display:flex;gap:8px;align-items:center;margin:-2px 0 14px;font-size:14px;color:#ccd9e8}.favfilter input{width:auto}.star{background:#253850;color:#ddeaf8;border:1px solid #526681}.star.active{background:#655221;color:#ffdf73}.buttons{display:flex;gap:8px;align-items:center}.help{font-size:12px;color:#9eacc0}.fill-editor{display:grid;gap:8px;margin:12px 0;padding:12px;background:#1a2940;border-radius:9px}.fill-editor label{font-size:13px;color:#c8d7ed}.fill-editor input{padding:9px}.preview{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c1422;border-radius:8px;padding:12px;font-size:13px;line-height:1.6}.card{background:#151e30;border:1px solid #324054;border-radius:12px;padding:17px;margin-bottom:13px}.tag{font-size:12px;color:#8fe0bd}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.card h2{font-size:18px;margin:7px 0}.prompt{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1321;border:1px solid #2f415c;padding:12px;border-radius:8px;font-size:14px;line-height:1.7}button{border:0;border-radius:8px;padding:9px 14px;color:#07180f;background:#79dcb2;font-weight:700;cursor:pointer}small{color:#a7b6c9}@media(max-width:670px){.filters{grid-template-columns:1fr}}</style></head><body><header><a href="./index.html">← エージェント集へ戻る</a><h1>汎用プロンプト集</h1><p>ChatGPT・Microsoft 365 Copilot向け。［　］を自分の内容に置き換えてコピーできます。</p></header><main><div class="filters"><input id="q" type="search" placeholder="用途・キーワードで検索" aria-label="プロンプト検索"><select id="category" aria-label="カテゴリ"></select><select id="sort" aria-label="並び替え"><option value="default">元の順番</option><option value="popular">よく使う順</option><option value="favorites">お気に入り優先</option></select></div><label class="favfilter"><input id="onlyFav" type="checkbox"> お気に入りだけ表示</label><p class="help">★でお気に入り登録できます。コピーした回数を「よく使う順」に反映します。記録はこの端末のブラウザ内だけに保存されます。</p><p id="count"></p><div id="list"></div><small>公開して問題のない汎用テンプレートのみを収録しています。機密情報の入力先は所属組織の規程に従ってください。</small></main><script>const items=[["調査・情報収集","一次情報で調査","次のテーマを調査してください：［テーマ］。公式資料・原著など一次情報を優先し、重要な事実、根拠URL、確認日、未確認点を分けてまとめてください。最新情報を確認できない場合は明記してください。"],["調査・情報収集","複数候補を比較","［比較対象A］と［比較対象B］について、目的［目的］に沿って、評価軸・根拠・長所短所・不明点を比較表にしてください。条件差がある項目を単純比較しないでください。"],["調査・情報収集","情報の真偽確認","次の主張の真偽を検証してください：［主張］。確認済み事実、反証、出典の信頼性、現時点で断定できない点を区別してください。"],["調査・情報収集","最新変更点の抽出","［製品・制度］の前回確認時点［日付］からの変更点を調べ、変更前後、利用者への影響、試す価値、公式出典を簡潔に示してください。"],["文章・メール","丁寧なメール作成","以下の要件から、件名と送信可能なメール本文を作成してください。相手：［相手］、目的：［目的］、伝えたい内容：［内容］、希望する丁寧さ：［トーン］。未提供の事実を補わないでください。"],["文章・メール","返信文の作成","次のメールへの返信を作成してください。［受信文］。返信方針：［要点］。相手の質問に漏れなく答え、簡潔で自然なビジネス日本語にしてください。"],["文章・メール","文章を短く整理","次の文章の意味を変えずに、読みやすく簡潔に直してください：［文章］。修正後の全文と、主な変更点を提示してください。"],["文章・メール","箇条書きを文章化","次の箇条書きを、読み手［対象読者］向けの自然な文章にしてください：［メモ］。事実・数値は元の内容を維持してください。"],["資料作成","5枚のスライド構成","テーマ［テーマ］について、対象読者［読者］、目的［目的］に合う5枚のスライド構成を考えてください。各枚に結論型タイトル、根拠、図表案、話す内容を付けてください。"],["資料作成","1ページ要約","次の内容を、結論・背景・根拠・リスク・次のアクションに分けて1ページ相当に要約してください：［内容］。重要な条件と未確認事項は残してください。"],["資料作成","伝わる図表を選ぶ","［データの概要］について、目的［伝えたい結論］に合うグラフや表の種類、軸・単位・凡例・注記の設計案を示してください。実データがなければ架空の数値を描かないでください。"],["分析・問題解決","原因仮説の整理","課題［現象］について、事実・仮説・未確認情報を区別し、原因候補、根拠、反証条件、優先して確認する3項目を整理してください。"],["分析・問題解決","意思決定の比較","選択肢［候補］を、目的［目的］、制約［制約］に基づいて比較してください。判断基準、トレードオフ、重大な不明点、推奨案とその条件を示してください。"],["分析・問題解決","反論と弱点の点検","次の提案を批判的にレビューしてください：［提案］。成立条件、見落とし、反対意見、追加で確認すべき根拠、改善策を整理してください。"],["学習・理解","ゼロから解説","［学びたいテーマ］を、前提知識が少ない人にも分かるように、全体像→基本原理→具体例→よくある誤解の順に説明してください。"],["学習・理解","数式の意味を説明","式［数式］について、変数・単位・前提条件・各項の物理的意味・使えない条件を段階的に説明してください。"],["学習・理解","理解度テスト","［テーマ］から理解度確認の問題を5問出してください。1問ずつ出題し、私の回答後に正誤・理由・改善点を解説してください。"],["Excel・プログラミング","Excel関数の提案","Excelで［やりたい処理］を実現する式を作ってください。列構成：［列名・セル例］。完成式、使い方、エラー処理を示してください。"],["Excel・プログラミング","Pythonコード作成","Pythonで［処理内容］を実現するコードを作成してください。入力：［形式］、出力：［形式］。依存ライブラリ、実行手順、テスト、元データ保護を含め、未実行なら明記してください。"],["Excel・プログラミング","エラーの原因を切り分け","以下のエラーを調査してください。環境：［環境］、操作：［操作］、エラー全文：［エラー］、期待結果：［期待］。原因仮説、確認順、最小修正案を提示してください。"],["AI活用・業務効率化","プロンプト改善","次のプロンプトを、目的の明確化、入力条件、回答形式、誤認防止の観点から改善してください：［元プロンプト］。改善後と変更理由を示してください。"],["AI活用・業務効率化","定型作業の効率化","作業［手順］を効率化したいです。現状の手作業、必要ツール、実行権限、安全上の注意、改善案を整理し、最も負担が小さい方法を提案してください。"],["AI活用・業務効率化","タスクの優先順位","次のタスク一覧を、期限、重要度、所要時間、依存関係で整理し、今日実施する順番と理由を示してください：［タスク一覧］。"]];const $=id=>document.getElementById(id);
 const KEY='prompt-library-general-v1';
 let stored={};
 try{stored=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){stored={}}
 const favorites=stored.favorites&&typeof stored.favorites==='object'?stored.favorites:{};
 const uses=stored.uses&&typeof stored.uses==='object'?stored.uses:{};
 function save(){try{localStorage.setItem(KEY,JSON.stringify({favorites,uses}))}catch(e){}}
 function key(item){return item[0]+'::'+item[1]}
 const cats=['すべて',...new Set(items.map(x=>x[0]))];
 cats.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;$('category').append(o)});
 function render(){
 const q=$('q').value.toLowerCase(),c=$('category').value,sort=$('sort').value,onlyFav=$('onlyFav').checked;
 const filtered=items.map((item,index)=>({item,index})).filter(({item})=>(c==='すべて'||item[0]===c)&&item.join(' ').toLowerCase().includes(q)&&(!onlyFav||favorites[key(item)]));
 if(sort==='popular')filtered.sort((a,b)=>(uses[key(b.item)]||0)-(uses[key(a.item)]||0)||a.index-b.index);
 if(sort==='favorites')filtered.sort((a,b)=>Number(!!favorites[key(b.item)])-Number(!!favorites[key(a.item)])||a.index-b.index);
 $('count').textContent=filtered.length+'件のプロンプト';$('list').replaceChildren();
 for(const {item} of filtered){const [cat,name,prompt]=item,id=key(item);
 const box=document.createElement('article');box.className='card';
 const top=document.createElement('div');top.className='top';
 const head=document.createElement('div');
 const tag=document.createElement('div');tag.className='tag';tag.textContent=cat;
 const title=document.createElement('h2');title.textContent=name;
 const counter=document.createElement('small');counter.textContent='コピー '+(uses[id]||0)+'回';
 head.append(tag,title,counter);
 const controls=document.createElement('div');controls.className='buttons';
 const star=document.createElement('button');star.className='star'+(favorites[id]?' active':'');star.textContent=favorites[id]?'★':'☆';star.setAttribute('aria-label',favorites[id]?'お気に入り解除':'お気に入り登録');star.title='お気に入り';star.onclick=()=>{favorites[id]=!favorites[id];save();render()};
 const btn=document.createElement('button');btn.textContent='コピー';
 const content=document.createElement('div');content.className='prompt';content.textContent=prompt;
 btn.onclick=async()=>{let succeeded=false;try{await navigator.clipboard.writeText(prompt);succeeded=true}catch(e){const r=document.createRange();r.selectNodeContents(content);getSelection().removeAllRanges();getSelection().addRange(r);alert('文章を選択しました。コピーしてください。')}
 if(succeeded){uses[id]=(uses[id]||0)+1;save();btn.textContent='コピー完了';counter.textContent='コピー '+uses[id]+'回';if($('sort').value==='popular')setTimeout(render,700);else setTimeout(()=>btn.textContent='コピー',1500)}};
 const fields=[...new Set([...prompt.matchAll(/［([^］]+)］/g)].map(m=>m[1]))];let filled={};let finalText=prompt;const editor=document.createElement('div');editor.className='fill-editor';editor.hidden=true;const preview=document.createElement('div');preview.className='preview';const update=()=>{finalText=prompt.replace(/［([^］]+)］/g,(m,k)=>filled[k]||m);preview.textContent=finalText};for(const field of fields){const label=document.createElement('label');label.textContent=field;const inp=document.createElement('input');inp.placeholder=field;inp.setAttribute('aria-label',field);inp.oninput=()=>{filled[field]=inp.value;update()};editor.append(label,inp)}update();editor.append(preview);const filledCopy=document.createElement('button');filledCopy.textContent='完成版をコピー';filledCopy.onclick=async()=>{try{await navigator.clipboard.writeText(finalText);uses[id]=(uses[id]||0)+1;save();counter.textContent='コピー '+uses[id]+'回';filledCopy.textContent='コピー完了';setTimeout(()=>filledCopy.textContent='完成版をコピー',1500)}catch(e){alert('コピーできませんでした。プレビューから選択してコピーしてください。')}};editor.append(filledCopy);if(fields.length){const editBtn=document.createElement('button');editBtn.textContent='穴埋め入力';editBtn.onclick=()=>{editor.hidden=!editor.hidden};controls.append(editBtn)}controls.append(star,btn);top.append(head,controls);box.append(top,content,editor);$('list').append(box)}
 }
 $('q').oninput=render;$('category').onchange=render;$('sort').onchange=render;$('onlyFav').onchange=render;render();</script></body></html>
